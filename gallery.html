<body>
<a class="skip-link" href="#main">Перейти до вмісту</a>
<header class="header" id="header"></header>
<div class="menu" id="menu" aria-hidden="true" tabindex="-1"></div>

<main id="main">

<section class="phero">
  <div class="phero__media">
    <picture>
      <source media="(max-width: 760px)" type="image/avif" srcset="images/cabana-lake-p-640.avif 640w, images/cabana-lake-p-960.avif 960w, images/cabana-lake-p-1280.avif 1280w" sizes="100vw">
      <source media="(max-width: 760px)" type="image/webp" srcset="images/cabana-lake-p-640.webp 640w, images/cabana-lake-p-960.webp 960w, images/cabana-lake-p-1280.webp 1280w" sizes="100vw">
      <source type="image/avif" srcset="images/cabana-lake-960.avif 960w, images/cabana-lake-1600.avif 1600w, images/cabana-lake-2560.avif 2560w" sizes="100vw">
      <source type="image/webp" srcset="images/cabana-lake-960.webp 960w, images/cabana-lake-1600.webp 1600w, images/cabana-lake-2560.webp 2560w" sizes="100vw">
      <img src="images/cabana-lake-1600.webp" width="3200" height="1800" style="--fx:50%;--fy:55%"
           fetchpriority="high" decoding="async"
           alt="Стіл під парасолькою на терасі біля води, поруч штори шатра">
    </picture>
  </div>
  <div class="phero__body wrap">
    <nav class="crumbs" aria-label="Хлібні крихти">
      <a href="index.html">Головна</a><span>/</span><span aria-current="page">Галерея</span>
    </nav>
    <p class="label" style="color:rgba(242,240,233,.78)">Галерея</p>
    <h1 class="display d1 phero__title">Як це виглядає насправді</h1>
    <p class="lead phero__lead">Жодних рендерів і стоку — тільки те, що знято на самій базі.</p>
  </div>
</section>

<section class="section on-paper">
  <div class="wrap">
    <div class="gfilter" id="gfilter" role="group" aria-label="Фільтр галереї" data-reveal></div>
    <div class="ggrid" id="ggrid" style="margin-top:clamp(1.6rem,4vh,2.4rem)"></div>
  </div>
</section>

<section class="section on-linen">
  <div class="wrap" style="text-align:center;display:grid;justify-items:center;gap:1.4rem">
    <div class="rule-bird" style="width:min(460px,80vw)" aria-hidden="true"></div>
    <h2 class="display d2" data-split style="max-width:16ch">Побачити наживо краще, ніж на фото</h2>
    <div class="btns" data-reveal>
      <a class="btn" href="booking.html">Забронювати
        <svg class="btn__ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h18M14.4 5.4 21 12l-6.6 6.6"/></svg>
      </a>
      <a class="btn btn--ghost" href="contacts.html">Як доїхати</a>
    </div>
  </div>
</section>

</main>

<!-- Лайтбокс -->

    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" aria-hidden="true"><path d="M5.6 5.6 18.4 18.4M18.4 5.6 5.6 18.4"/></svg>
  </button>
  <button class="lightbox__nav lightbox__nav--prev" type="button" aria-label="Попереднє фото">
    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12H3M9.6 5.4 3 12l6.6 6.6"/></svg>
  </button>
  <button class="lightbox__nav lightbox__nav--next" type="button" aria-label="Наступне фото">
    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h18M14.4 5.4 21 12l-6.6 6.6"/></svg>
  </button>
  <div>
    <!-- Прозорий 1×1 як заглушка: справжній src проставляє
         js/pages.js при відкритті. Порожній або відсутній src
         браузер рахує за невдале завантаження. -->
    <img alt="" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7">
    <p class="lightbox__cap"></p>
  </div>
</div>
