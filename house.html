<body>
<a class="skip-link" href="#main">Перейти до вмісту</a>
<header class="header" id="header"></header>
<div class="menu" id="menu" aria-hidden="true" tabindex="-1"></div>

<section class="page-hero">
  <div class="page-hero__media" id="houseHero"></div>
  <div class="page-hero__body wrap">
    <nav class="crumbs" aria-label="Хлібні крихти">
      <a href="index.html">Головна</a><span>/</span>
      <a href="houses.html">Будиночки</a><span>/</span>
      <span id="houseKicker" aria-current="page"></span>
    </nav>
    <h1 id="houseTitle" style="margin-top:1rem"></h1>
    <p class="lead" id="houseLead"></p>
  </div>
</section>

<main id="main">
  <section class="section surface-ivory">
    <div class="wrap hdetail" id="houseDetail"></div>
  </section>

  <section class="section surface-sand-2">
    <div class="wrap">
      <p class="eyebrow" data-reveal>Фотографії</p>
      <h2 class="display d2" data-reveal style="margin:.6rem 0 clamp(1.5rem,4vh,2.5rem)">Як це виглядає</h2>
      <div class="hgal" id="houseGallery"></div>
    </div>
  </section>

  <section class="section surface-ivory">
    <div class="wrap">
      <p class="eyebrow" data-reveal>Інші будиночки</p>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:clamp(1rem,2.5vw,2rem);margin-top:1.5rem" id="otherHouses"></div>
    </div>
  </section>
</main>
<section class="section section--tight surface-ink">
  <div class="wrap ctabar">
    <div class="ctabar__text">
      <h2 class="display d2">Забронювати цей будиночок</h2>
      <p class="lead" style="margin-top:.8rem">Ми перевіримо доступність дат і зателефонуємо для підтвердження.</p>
    </div>
    <div class="ctabar__actions">
      <a class="btn btn--primary" href="booking.html?type=house">Залишити заявку</a>
      <a class="btn btn--ghost" href="houses.html">Усі будиночки</a>
    </div>
  </div>
</section>
