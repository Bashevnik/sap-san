name: Deploy to GitHub Pages

# Публікуємо обидві гілки одним деплоєм:
#   main → https://<user>.github.io/sap-san/
#   dev  → https://<user>.github.io/sap-san/dev/
#
# ВАЖЛИВО: середовище github-pages за замовчуванням дозволяє деплой
# лише з гілки за замовчуванням. Тому крок deploy виконується тільки
# для main — інакше запуски з dev падали б з помилкою.
# Вміст dev при цьому все одно потрапляє в збірку.
#
# Якщо потрібно, щоб пуш у dev теж одразу оновлював прев'ю:
#   Settings → Environments → github-pages → Deployment branches
#   → No restriction. Після цього приберіть умову if: у джобі deploy.

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Черга, а не скасування: інакше пуш у dev обриває деплой main
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main

      # dev може ще не існувати — тоді просто пропускаємо
      - name: Checkout dev
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: dev
          path: dev

      - name: Assemble site
        run: |
          mkdir -p _site
          rsync -a --exclude-from=main/.deployignore main/ _site/
          if [ -d dev ] && [ -f dev/index.html ]; then
            mkdir -p _site/dev
            rsync -a --exclude-from=main/.deployignore dev/ _site/dev/
            echo "dev-гілку опубліковано у /dev/"
          else
            echo "гілки dev ще немає — публікуємо лише main"
          fi
          echo "--- вміст _site ---"
          ls _site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    # Деплоїмо лише з main — обмеження середовища github-pages
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
